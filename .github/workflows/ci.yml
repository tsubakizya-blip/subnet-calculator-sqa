
name: SQA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Tests with Coverage
        run: uv run pytest test_main.py -v --cov=main --cov-report=term-missing

  docker:
    name: Build and Smoke Test Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Image
        run: docker build -t subnet-calculator .

      - name: Run Container
        run: docker run -d --name subnet-app -p 8000:8000 subnet-calculator

      - name: Smoke Test Container
        env:
          SMOKE_PERCOBAAN: "10"
          SMOKE_JEDA: "3"
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000

      - name: Show Container Logs on Failure
        if: failure()
        run: docker logs subnet-app
